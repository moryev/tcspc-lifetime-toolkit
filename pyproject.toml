[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcspc-lifetime-toolkit"
version = "0.1.0"
description = "A scientific Python toolkit for simulating and analysing of TCSPC decay data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
]

[project.scripts]
tcspc = "tcspc_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
